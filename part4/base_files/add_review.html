<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="beach-logo.png">
    <title>Add Review</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <!-- Mandatory -->
        <div id="logo-and-login">
			<img class="logo" src="logo.png" alt="site-logo">
			<button id="login-button">
				<a href="login.html" id="login-link">Login</a>
			</button>
		</div>
		<nav>
			<div id="navigation">
				<a href="index.html" id="index-link">Homepage</a>
				<a href="login.html" id="login-link">Login</a>
			</div>
		</nav>
    </header>
    <main>
        <!-- Add something to idfentify the place you're reviewing -->
        <form id="review-form">
            <label for="review-text">Review:</label>
            <textarea id="review-text" name="review-text" required></textarea>
                    
            <label for="review-rating">Rating:</label>
            <input type="number" id="review-rating" name="review-rating"  min="1" max="5" required>
                    
            <button type="submit">Submit</button>
        </form>
    </main>
    <script src="script.js"></script>
    <footer class="footer-container">
		<p>All rights reserved</p>
	</footer>
</body>
</html>
