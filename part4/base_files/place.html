<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/x-icon" href="beach-logo.png">
	<title>List of Places</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
		<!-- Mandatory -->
		<div id="logo-and-login">
			<img class="logo" src="logo.png" alt="site-logo">
			<button id="login-button">
				<a href="login.html" id="login-link">Login</a>
			</button>
		</div>
		<nav>
			<div id="navigation">
				<a href="index.html" id="index-link">Homepage</a>
				<a href="login.html" id="login-link">Login</a>
			</div>
		</nav>
	</header>
    <main>
        <section id="place-details">
            <!-- Place details will be populated dynamically -->
             <table class="actual-table">
                <caption><strong>Place</strong></caption>
                <!-- Place info will be populated dynamically -->
             </table>
        </section>
        <section id="reviews">
            <!-- Reviews will be populated dynamically -->
        </section>
        <section id="add-review">
            <h2>Add a Review</h2>
            <form id="review-form">
                <label for="review-text">Review:</label>
                <textarea id="review-text" name="review-text" required></textarea>
                
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
    <script src="scripts.js"></script>
    <footer class="footer-container">
		<p>All rights reserved</p>
	</footer>
</body>
</html>
